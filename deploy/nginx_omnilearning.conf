# omnilearn.org : plateforme e-learning (Next.js 16, pm2 :3003)
#
# Le domaine de la plateforme est omnilearn.org, PAS omnilearning.tech :
# omnilearning.tech héberge un autre site (OmniLearn Studio, activité conseil).
# Vérifié le 2026-08-11 par sonde HTTP : omnilearn.org/fr rend la plateforme
# (200), omnilearning.tech/fr rend 404, et le titre de omnilearning.tech est
# « OmniLearn Studio : sites, boutiques et applications métier ». Ce fichier
# nommait encore l'ancien domaine ; le certificat servi, lui, était déjà celui
# d'omnilearn.org.
#
# Les sous-chemins /legal/, /bank/, /ctf/, /exam-e-business/ sont préservés
# (mêmes backends que l'ancien vhost) : ils répondent bien sur omnilearn.org
# - /ctf/ et /exam-e-business/ rendent 200, /bank/ redirige vers son login.
server {
    server_name omnilearn.org www.omnilearn.org;

    client_max_body_size 50M;

    # --- Pages légales statiques (conservées) ---
    location /legal/ {
        root /var/www;
        try_files $uri $uri.html =404;
        default_type text/html;
    }

    # --- CyberBank streaming (chatbot) ---
    location /bank/api/chat/stream {
        proxy_pass http://127.0.0.1:5000/api/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- CyberBank app ---
    location /bank/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Script-Name /bank;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    location /bank/static/ {
        proxy_pass http://127.0.0.1:5000/static/;
        proxy_set_header Host $host;
    }

    # --- CTF Hub ---
    location /ctf/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    location /ctf/exports/ {
        alias /opt/ctf-hub/exports/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
        default_type application/pdf;
    }

    location /ctf/hub_static/ {
        proxy_pass http://127.0.0.1:5001/hub_static/;
        proxy_set_header Host $host;
    }

    # --- Exam e-business ---
    location /exam-e-business/admin {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /exam-e-business/submit {
        proxy_pass http://127.0.0.1:5050/exam-e-business/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 2M;
    }

    location /exam-e-business/ {
        alias /var/www/exam-e-business/;
        index index.html;
        try_files $uri $uri/ /exam-e-business/index.html;
    }

    # --- NOUVELLE plateforme e-learning OmniLearning (catch-all) ---
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/omnilearn.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnilearn.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name omnilearn.org www.omnilearn.org;
    return 301 https://$host$request_uri;
}
