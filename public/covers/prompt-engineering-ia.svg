<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Prompt engineering &amp; IA générative : passer d'utilisateur à opérateur">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#6d5cf5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#6d5cf5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6d5cf5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#0b0f0d"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  
    <g transform="translate(910 120)" font-family="'JetBrains Mono', ui-monospace, monospace">
      <rect x="0" y="0" width="300" height="210" rx="6" stroke="#6d5cf5" fill="none" stroke-width="3" opacity="0.55"/>
      <circle cx="22" cy="24" r="5" fill="#6d5cf5" opacity="0.7"/>
      <circle cx="42" cy="24" r="5" fill="#6d5cf5" opacity="0.4"/>
      <circle cx="62" cy="24" r="5" fill="#6d5cf5" opacity="0.25"/>
      <g stroke="#6d5cf5" stroke-width="6" stroke-linecap="round">
        <path d="M24 70 h130" opacity="0.8"/>
        <path d="M24 100 h190" opacity="0.45"/>
        <path d="M24 130 h90" opacity="0.45"/>
        <path d="M24 170 h50" opacity="0.9"/>
      </g>
      <rect x="86" y="160" width="14" height="20" fill="#6d5cf5" opacity="0.9"/>
    </g>

  <!-- prompt -->
  <text x="84" y="128" font-size="30" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#6d5cf5">$ <tspan fill="#9fb4a8">prompt-engineering-ia</tspan><tspan fill="#6d5cf5"> ▍</tspan></text>

  <!-- titre -->
  <text x="84" y="482" font-size="50" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">Prompt engineering &amp; IA générative</text>
  <text x="84" y="546" font-size="50" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">: passer d'utilisateur à opérateur</text>
  <rect x="84" y="572" width="120" height="6" fill="#6d5cf5"/>

  <!-- pied -->
  <text x="84" y="736" font-size="22" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5c6f64">omnilearn<tspan fill="#6d5cf5">.</tspan>formations</text>

  <rect width="1280" height="800" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="1277" height="797" fill="none" stroke="#6d5cf5" stroke-opacity="0.28" stroke-width="3"/>
</svg>
