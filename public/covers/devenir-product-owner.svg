<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Devenir Product Owner : de la vision à la livraison">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#3b82f6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#0b0f0d"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  
    <g transform="translate(910 110)" stroke="#3b82f6" fill="none" stroke-width="3">
      <rect x="0" y="0" width="80" height="220" rx="5" opacity="0.6"/>
      <rect x="100" y="0" width="80" height="220" rx="5" opacity="0.6"/>
      <rect x="200" y="0" width="80" height="220" rx="5" opacity="0.6"/>
      <rect x="14" y="20" width="52" height="34" rx="3" fill="#3b82f6" stroke="none" opacity="0.5"/>
      <rect x="14" y="66" width="52" height="34" rx="3" fill="#3b82f6" stroke="none" opacity="0.25"/>
      <rect x="114" y="20" width="52" height="34" rx="3" fill="#3b82f6" stroke="none" opacity="0.35"/>
      <rect x="214" y="20" width="52" height="34" rx="3" fill="#3b82f6" stroke="none" opacity="0.6"/>
      <path d="M40 260 h200" opacity="0.25"/>
    </g>

  <!-- prompt -->
  <text x="84" y="128" font-size="30" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#3b82f6">$ <tspan fill="#9fb4a8">devenir-product-owner</tspan><tspan fill="#3b82f6"> ▍</tspan></text>

  <!-- titre -->
  <text x="84" y="479" font-size="60" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">Devenir Product Owner : de la</text>
  <text x="84" y="556" font-size="60" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">vision à la livraison</text>
  <rect x="84" y="582" width="120" height="6" fill="#3b82f6"/>

  <!-- pied -->
  <text x="84" y="736" font-size="22" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5c6f64">omnilearn<tspan fill="#3b82f6">.</tspan>formations</text>

  <rect width="1280" height="800" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="1277" height="797" fill="none" stroke="#3b82f6" stroke-opacity="0.28" stroke-width="3"/>
</svg>
