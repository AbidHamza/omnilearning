<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="JavaScript moderne : de solide à expert">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#0ca8d3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#0ca8d3" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0ca8d3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#0b0f0d"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  
    <g transform="translate(940 110)" stroke="#0ca8d3" fill="none" stroke-width="3">
      <path d="M30 20 C0 20 15 90 -15 105 C15 120 0 190 30 190" opacity="0.85"/>
      <path d="M150 20 C180 20 165 90 195 105 C165 120 180 190 150 190" opacity="0.85"/>
      <path d="M55 150 L95 60 L105 60" opacity="0.5"/>
      <circle cx="90" cy="105" r="6" fill="#0ca8d3" stroke="none" opacity="0.7"/>
      <path d="M-20 250 h220 M-20 286 h150" opacity="0.25"/>
    </g>

  <!-- prompt -->
  <text x="84" y="128" font-size="30" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#0ca8d3">$ <tspan fill="#9fb4a8">javascript-cours-expert</tspan><tspan fill="#0ca8d3"> ▍</tspan></text>

  <!-- titre -->
  <text x="84" y="479" font-size="60" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">JavaScript moderne : de</text>
  <text x="84" y="556" font-size="60" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">solide à expert</text>
  <rect x="84" y="582" width="120" height="6" fill="#0ca8d3"/>

  <!-- pied -->
  <text x="84" y="736" font-size="22" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5c6f64">omnilearn<tspan fill="#0ca8d3">.</tspan>formations</text>

  <rect width="1280" height="800" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="1277" height="797" fill="none" stroke="#0ca8d3" stroke-opacity="0.28" stroke-width="3"/>
</svg>
