<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Machine Learning : les fondamentaux">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#eab308" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#0b0f0d"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- nuage de points et droite de regression -->
  <g transform="translate(860 90)" stroke="#eab308" fill="none" stroke-width="2">
    <line x1="0" y1="260" x2="0" y2="0" stroke-opacity="0.4"/>
    <line x1="0" y1="260" x2="300" y2="260" stroke-opacity="0.4"/>
    <line x1="18" y1="230" x2="292" y2="60" stroke-width="3" stroke-opacity="0.9"/>
    <circle cx="40" cy="222" r="6" fill="#eab308" stroke="none" opacity="0.85"/>
    <circle cx="70" cy="190" r="6" fill="#eab308" stroke="none" opacity="0.85"/>
    <circle cx="95" cy="205" r="6" fill="#eab308" stroke="none" opacity="0.7"/>
    <circle cx="130" cy="160" r="6" fill="#eab308" stroke="none" opacity="0.85"/>
    <circle cx="155" cy="140" r="6" fill="#eab308" stroke="none" opacity="0.7"/>
    <circle cx="180" cy="150" r="6" fill="#eab308" stroke="none" opacity="0.85"/>
    <circle cx="210" cy="110" r="6" fill="#eab308" stroke="none" opacity="0.7"/>
    <circle cx="235" cy="95" r="6" fill="#eab308" stroke="none" opacity="0.85"/>
    <circle cx="260" cy="75" r="6" fill="#eab308" stroke="none" opacity="0.7"/>
    <circle cx="275" cy="100" r="6" fill="#eab308" stroke="none" opacity="0.6"/>
  </g>

  <!-- prompt -->
  <text x="84" y="128" font-size="30" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#eab308">$ <tspan fill="#9fb4a8">ml-fondamentaux</tspan><tspan fill="#eab308"> ▍</tspan></text>

  <!-- titre -->
  <text x="84" y="479" font-size="56" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">Machine Learning :</text>
  <text x="84" y="556" font-size="56" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">les fondamentaux</text>
  <rect x="84" y="582" width="120" height="6" fill="#eab308"/>

  <!-- pied -->
  <text x="84" y="736" font-size="22" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5c6f64">omnilearn<tspan fill="#eab308">.</tspan>formations</text>

  <rect width="1280" height="800" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="1277" height="797" fill="none" stroke="#eab308" stroke-opacity="0.28" stroke-width="3"/>
</svg>
