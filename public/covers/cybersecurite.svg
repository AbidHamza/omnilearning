<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Cybersécurité : comprendre, détecter, défendre">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#2563eb" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#0b0f0d"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  
    <g transform="translate(950 110)" stroke="#2563eb" fill="none" stroke-width="3">
      <path d="M80 0 L160 32 V110 C160 175 120 210 80 228 C40 210 0 175 0 110 V32 Z" opacity="0.8"/>
      <path d="M45 110 L72 138 L120 78" opacity="0.9"/>
      <circle cx="80" cy="300" r="5" fill="#2563eb" stroke="none" opacity="0.5"/>
      <circle cx="20" cy="278" r="5" fill="#2563eb" stroke="none" opacity="0.3"/>
      <circle cx="140" cy="278" r="5" fill="#2563eb" stroke="none" opacity="0.3"/>
      <path d="M20 278 L80 300 L140 278" opacity="0.3"/>
    </g>

  <!-- prompt -->
  <text x="84" y="128" font-size="30" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#2563eb">$ <tspan fill="#9fb4a8">cybersecurite</tspan><tspan fill="#2563eb"> ▍</tspan></text>

  <!-- titre -->
  <text x="84" y="479" font-size="60" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">Cybersécurité : comprendre,</text>
  <text x="84" y="556" font-size="60" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">détecter, défendre</text>
  <rect x="84" y="582" width="120" height="6" fill="#2563eb"/>

  <!-- pied -->
  <text x="84" y="736" font-size="22" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5c6f64">omnilearn<tspan fill="#2563eb">.</tspan>formations</text>

  <rect width="1280" height="800" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="1277" height="797" fill="none" stroke="#2563eb" stroke-opacity="0.28" stroke-width="3"/>
</svg>
