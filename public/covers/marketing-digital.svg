<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Marketing digital : acquérir et fidéliser ses premiers clients">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#2563eb" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#0b0f0d"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  
    <g transform="translate(920 110)" stroke="#2563eb" fill="none" stroke-width="3">
      <path d="M0 0 H260 L170 110 V210 L90 250 V110 Z" opacity="0.8"/>
      <path d="M40 40 H220" opacity="0.35"/>
      <path d="M75 78 H185" opacity="0.35"/>
      <circle cx="130" cy="300" r="6" fill="#2563eb" stroke="none" opacity="0.8"/>
      <path d="M130 258 V288" opacity="0.5"/>
    </g>

  <!-- prompt -->
  <text x="84" y="128" font-size="30" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#2563eb">$ <tspan fill="#9fb4a8">marketing-digital</tspan><tspan fill="#2563eb"> ▍</tspan></text>

  <!-- titre -->
  <text x="84" y="482" font-size="50" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">Marketing digital : acquérir et</text>
  <text x="84" y="546" font-size="50" font-weight="700" fill="#e8f2ec" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="-1">fidéliser ses premiers clients</text>
  <rect x="84" y="572" width="120" height="6" fill="#2563eb"/>

  <!-- pied -->
  <text x="84" y="736" font-size="22" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5c6f64">omnilearn<tspan fill="#2563eb">.</tspan>formations</text>

  <rect width="1280" height="800" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="1277" height="797" fill="none" stroke="#2563eb" stroke-opacity="0.28" stroke-width="3"/>
</svg>
